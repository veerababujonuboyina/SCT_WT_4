<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do App</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

    <h1>📝 Smart To-Do App</h1>

    <div class="input-box">
        <input type="text" id="taskInput" placeholder="Enter your task">

        <input type="datetime-local" id="taskDate">

        <button onclick="addTask()">
            <i class="fa-solid fa-plus"></i>
            Add Task
        </button>
    </div>

    <div class="stats-card">

        <div class="stats-header">
            <h3>Task Progress</h3>
            <span id="progressPercent">0%</span>
        </div>

        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>

        <div class="task-stats">

            <div class="stat-box">
                <h2 id="totalTasks">0</h2>
                <p>Total</p>
            </div>

            <div class="stat-box completed-box">
                <h2 id="completedTasks">0</h2>
                <p>Completed</p>
            </div>

            <div class="stat-box pending-box">
                <h2 id="pendingTasks">0</h2>
                <p>Pending</p>
            </div>

        </div>
    </div>

    <ul id="taskList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
